<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RELIC - marketplace de itens colecionáveis raros e vintage: vinis, cartas, livros e jogos." />
    <title>RELIC | Marketplace de colecionáveis</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Aplica o tema salvo antes da pintura para evitar flash de tela clara. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem("relic-theme")) === "dark") {
          document.body.classList.add("theme-dark");
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
